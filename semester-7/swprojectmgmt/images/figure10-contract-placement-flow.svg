<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" font-family="Arial, sans-serif">
  <rect width="720" height="160" fill="#fff" rx="8"/>

  <!-- Step 1: Requirements -->
  <rect x="10" y="40" width="150" height="60" rx="10" fill="#e74c3c"/>
  <text x="85" y="66" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Requirements</text>
  <text x="85" y="84" text-anchor="middle" fill="#fadbd8" font-size="12">Analysis</text>

  <!-- Arrow 1 -->
  <line x1="160" y1="70" x2="195" y2="70" stroke="#333" stroke-width="2.5"/>
  <polygon points="195,63 210,70 195,77" fill="#333"/>

  <!-- Step 2: ITT -->
  <rect x="210" y="40" width="150" height="60" rx="10" fill="#2980b9"/>
  <text x="285" y="66" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Invitation to</text>
  <text x="285" y="84" text-anchor="middle" fill="#d4e6f1" font-size="12">Tender (ITT)</text>

  <!-- Arrow 2 -->
  <line x1="360" y1="70" x2="395" y2="70" stroke="#333" stroke-width="2.5"/>
  <polygon points="395,63 410,70 395,77" fill="#333"/>

  <!-- Step 3: Evaluation -->
  <rect x="410" y="40" width="150" height="60" rx="10" fill="#27ae60"/>
  <text x="485" y="66" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Evaluation of</text>
  <text x="485" y="84" text-anchor="middle" fill="#d5f5e3" font-size="12">Proposals</text>

  <!-- Arrow 3 -->
  <line x1="560" y1="70" x2="595" y2="70" stroke="#333" stroke-width="2.5"/>
  <polygon points="595,63 610,70 595,77" fill="#333"/>

  <!-- Step 4: Award -->
  <rect x="610" y="40" width="100" height="60" rx="10" fill="#8e44ad"/>
  <text x="660" y="75" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Contract</text>

  <!-- Bottom labels -->
  <text x="85" y="125" text-anchor="middle" fill="#666" font-size="10">Define scope, functions,</text>
  <text x="85" y="138" text-anchor="middle" fill="#666" font-size="10">deadlines, standards</text>

  <text x="285" y="125" text-anchor="middle" fill="#666" font-size="10">Open / Restricted /</text>
  <text x="285" y="138" text-anchor="middle" fill="#666" font-size="10">Negotiated tendering</text>

  <text x="485" y="125" text-anchor="middle" fill="#666" font-size="10">Value for Money (VFM)</text>
  <text x="485" y="138" text-anchor="middle" fill="#666" font-size="10">assessment</text>

  <text x="660" y="125" text-anchor="middle" fill="#666" font-size="10">Formal agreement</text>
  <text x="660" y="138" text-anchor="middle" fill="#666" font-size="10">signed</text>
</svg>