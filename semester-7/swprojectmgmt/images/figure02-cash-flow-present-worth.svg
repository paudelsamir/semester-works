<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Arial, sans-serif">
  <rect width="700" height="300" fill="#fff" rx="8"/>
  <text x="350" y="30" text-anchor="middle" fill="#333" font-size="16" font-weight="bold">Cash Flow Diagram — Present Worth Concept</text>

  <!-- Horizontal timeline -->
  <line x1="60" y1="200" x2="640" y2="200" stroke="#333" stroke-width="3"/>
  <polygon points="640,194 660,200 640,206" fill="#333"/>

  <!-- Year markers -->
  <line x1="100" y1="195" x2="100" y2="205" stroke="#333" stroke-width="2"/>
  <text x="100" y="220" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">0</text>
  <line x1="190" y1="195" x2="190" y2="205" stroke="#333" stroke-width="2"/>
  <text x="190" y="220" text-anchor="middle" fill="#333" font-size="12">1</text>
  <line x1="280" y1="195" x2="280" y2="205" stroke="#333" stroke-width="2"/>
  <text x="280" y="220" text-anchor="middle" fill="#333" font-size="12">2</text>
  <line x1="370" y1="195" x2="370" y2="205" stroke="#333" stroke-width="2"/>
  <text x="370" y="220" text-anchor="middle" fill="#333" font-size="12">3</text>
  <line x1="460" y1="195" x2="460" y2="205" stroke="#333" stroke-width="2"/>
  <text x="460" y="220" text-anchor="middle" fill="#333" font-size="12">4</text>
  <line x1="550" y1="195" x2="550" y2="205" stroke="#333" stroke-width="2"/>
  <text x="550" y="220" text-anchor="middle" fill="#333" font-size="12">5</text>
  <text x="620" y="220" text-anchor="middle" fill="#333" font-size="11">n</text>

  <!-- Outflow at time 0 (investment) -->
  <line x1="100" y1="200" x2="100" y2="100" stroke="#e74c3c" stroke-width="3"/>
  <polygon points="94,100 100,85 106,100" fill="#e74c3c"/>
  <text x="100" y="80" text-anchor="middle" fill="#e74c3c" font-size="12" font-weight="bold">P</text>
  <text x="100" y="65" text-anchor="middle" fill="#c0392b" font-size="10">(Investment)</text>

  <!-- Inflows at years 1-5 -->
  <line x1="190" y1="200" x2="190" y2="130" stroke="#27ae60" stroke-width="3"/>
  <polygon points="184,130 190,115 196,130" fill="#27ae60"/>
  <text x="190" y="110" text-anchor="middle" fill="#27ae60" font-size="12" font-weight="bold">A</text>

  <line x1="280" y1="200" x2="280" y2="130" stroke="#27ae60" stroke-width="3"/>
  <polygon points="274,130 280,115 286,130" fill="#27ae60"/>
  <text x="280" y="110" text-anchor="middle" fill="#27ae60" font-size="12" font-weight="bold">A</text>

  <line x1="370" y1="200" x2="370" y2="130" stroke="#27ae60" stroke-width="3"/>
  <polygon points="364,130 370,115 376,130" fill="#27ae60"/>
  <text x="370" y="110" text-anchor="middle" fill="#27ae60" font-size="12" font-weight="bold">A</text>

  <line x1="460" y1="200" x2="460" y2="130" stroke="#27ae60" stroke-width="3"/>
  <polygon points="454,130 460,115 466,130" fill="#27ae60"/>
  <text x="460" y="110" text-anchor="middle" fill="#27ae60" font-size="12" font-weight="bold">A</text>

  <line x1="550" y1="200" x2="550" y2="130" stroke="#27ae60" stroke-width="3"/>
  <polygon points="544,130 550,115 556,130" fill="#27ae60"/>
  <text x="550" y="110" text-anchor="middle" fill="#27ae60" font-size="12" font-weight="bold">A + F</text>

  <!-- Present worth arrow pointing back to 0 -->
  <path d="M 370,155 Q 370,50 100,50" fill="none" stroke="#2980b9" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="100,44 90,50 100,56" fill="#2980b9"/>
  <rect x="180" y="38" width="200" height="28" rx="14" fill="#2980b9"/>
  <text x="280" y="57" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Present Worth (PW / NPW)</text>

  <!-- Legend -->
  <rect x="80" y="250" width="14" height="14" rx="3" fill="#e74c3c"/>
  <text x="100" y="262" fill="#555" font-size="11">Outflow (Investment)</text>
  <rect x="300" y="250" width="14" height="14" rx="3" fill="#27ae60"/>
  <text x="320" y="262" fill="#555" font-size="11">Inflow (Returns / Savings)</text>

  <text x="350" y="288" text-anchor="middle" fill="#888" font-size="10">NPW = –P + A(P/A, i, n) + F(P/F, i, n)</text>
</svg>