<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="Arial, sans-serif">
  <rect width="700" height="450" fill="#fff" rx="8"/>
  <text x="350" y="30" text-anchor="middle" fill="#333" font-size="16" font-weight="bold">Earned Value Management - S-Curve</text>

  <!-- Axes -->
  <line x1="80" y1="380" x2="650" y2="380" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="380" x2="80" y2="40" stroke="#333" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="65" y="384" text-anchor="end" fill="#666" font-size="11">0</text>
  <text x="65" y="290" text-anchor="end" fill="#666" font-size="11">50%</text>
  <text x="65" y="195" text-anchor="end" fill="#666" font-size="11">100%</text>
  <text x="20" y="210" text-anchor="middle" fill="#333" font-size="12" transform="rotate(-90,20,210)">Cost / Value</text>

  <!-- X-axis labels -->
  <text x="80" y="400" text-anchor="middle" fill="#666" font-size="11">Start</text>
  <text x="365" y="400" text-anchor="middle" fill="#666" font-size="11">Time Now</text>
  <text x="620" y="400" text-anchor="middle" fill="#666" font-size="11">End</text>
  <text x="350" y="430" text-anchor="middle" fill="#333" font-size="12">Time</text>

  <!-- Grid lines -->
  <line x1="80" y1="284" x2="650" y2="284" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="188" x2="650" y2="188" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="365" y1="40" x2="365" y2="380" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- PV Curve (Planned Value - S-curve) -->
  <path d="M80,380 Q200,380 280,310 Q320,270 365,240 Q410,200 480,120 Q550,50 620,50" fill="none" stroke="#2980b9" stroke-width="3"/>
  <text x="630" y="45" fill="#2980b9" font-size="13" font-weight="bold">PV</text>

  <!-- EV Curve (Earned Value - below PV, behind schedule) -->
  <path d="M80,380 Q200,380 280,340 Q320,320 365,300 Q400,280 450,240 Q500,200 560,140" fill="none" stroke="#27ae60" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="568" y="135" fill="#27ae60" font-size="13" font-weight="bold">EV</text>

  <!-- AC Curve (Actual Cost - above PV, over budget) -->
  <path d="M80,380 Q200,370 280,330 Q320,300 365,270 Q420,220 480,160 Q530,110 580,80" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="588" y="75" fill="#e74c3c" font-size="13" font-weight="bold">AC</text>

  <!-- "Time Now" marker line -->
  <line x1="365" y1="40" x2="365" y2="380" stroke="#e67e22" stroke-width="2"/>
  <text x="365" y="420" text-anchor="middle" fill="#e67e22" font-size="11" font-weight="bold">Status Date</text>

  <!-- SV gap (between PV and EV at Time Now) -->
  <line x1="365" y1="240" x2="365" y2="300" stroke="#f39c12" stroke-width="4" stroke-linecap="round"/>
  <text x="375" y="275" fill="#f39c12" font-size="11" font-weight="bold">SV</text>

  <!-- CV gap (between EV and AC at Time Now) -->
  <line x1="365" y1="270" x2="365" y2="300" stroke="#8e44ad" stroke-width="4" stroke-linecap="round"/>
  <text x="375" y="320" fill="#8e44ad" font-size="11" font-weight="bold">CV</text>

  <!-- BAC line (Budget at Completion) -->
  <line x1="80" y1="188" x2="620" y2="188" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="628" y="192" fill="#7f8c8d" font-size="11">BAC</text>

  <!-- Legend -->
  <rect x="120" y="52" width="12" height="12" fill="#2980b9"/>
  <text x="136" y="63" fill="#333" font-size="11">PV (Planned Value)</text>
  <rect x="300" y="52" width="12" height="12" fill="#27ae60"/>
  <text x="316" y="63" fill="#333" font-size="11">EV (Earned Value)</text>
  <rect x="480" y="52" width="12" height="12" fill="#e74c3c"/>
  <text x="496" y="63" fill="#333" font-size="11">AC (Actual Cost)</text>
</svg>