<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="Arial, sans-serif">
  <rect width="600" height="350" fill="#fff" rx="8"/>
  <rect x="200" y="20" width="200" height="44" rx="22" fill="#1a5276"/>
  <text x="300" y="47" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">Project Analysis</text>

  <line x1="300" y1="64" x2="300" y2="95" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="95" x2="500" y2="95" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="95" x2="100" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="95" x2="300" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="500" y1="95" x2="500" y2="120" stroke="#333" stroke-width="2"/>

  <rect x="10" y="120" width="180" height="44" rx="22" fill="#e74c3c"/>
  <text x="100" y="147" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Strategic Assessment</text>
  <line x1="100" y1="164" x2="100" y2="190" stroke="#333" stroke-width="1.5"/>
  <rect x="10" y="190" width="180" height="40" rx="8" fill="#fadbd8" stroke="#e74c3c" stroke-width="1"/>
  <text x="100" y="209" text-anchor="middle" fill="#c0392b" font-size="11" font-style="italic">Does it fit the bigger picture?</text>

  <rect x="210" y="120" width="180" height="44" rx="22" fill="#2980b9"/>
  <text x="300" y="147" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Technical Assessment</text>
  <line x1="300" y1="164" x2="300" y2="190" stroke="#333" stroke-width="1.5"/>
  <rect x="210" y="190" width="180" height="40" rx="8" fill="#d4e6f1" stroke="#2980b9" stroke-width="1"/>
  <text x="300" y="209" text-anchor="middle" fill="#2471a3" font-size="11" font-style="italic">Can we actually build it?</text>

  <rect x="410" y="120" width="180" height="44" rx="22" fill="#27ae60"/>
  <text x="500" y="147" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Economic Analysis</text>
  <line x1="500" y1="164" x2="500" y2="190" stroke="#333" stroke-width="1.5"/>
  <rect x="410" y="190" width="180" height="40" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="500" y="209" text-anchor="middle" fill="#229954" font-size="11" font-style="italic">Does it make financial sense?</text>

  <rect x="150" y="305" width="300" height="30" rx="15" fill="#f0f3f4" stroke="#bdc3c7" stroke-width="1"/>
  <text x="300" y="325" text-anchor="middle" fill="#555" font-size="12">"Is this project worth doing?"</text>
</svg>