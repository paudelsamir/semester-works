  <text x="725" y="474" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">UNIT 8 — SQA &amp; Testing</text>
  <rect x="605" y="486" width="80" height="18" rx="9" fill="#148f77"/>
  <text x="645" y="498" text-anchor="middle" fill="#d1f2eb" font-size="8">Test Plan</text>
  <rect x="695" y="486" width="80" height="18" rx="9" fill="#148f77"/>
  <text x="735" y="498" text-anchor="middle" fill="#d1f2eb" font-size="8">Types &amp; Levels</text>
  <rect x="785" y="486" width="60" height="18" rx="9" fill="#148f77"/>
  <text x="815" y="498" text-anchor="middle" fill="#d1f2eb" font-size="8">V&amp;V</text>
  <rect x="605" y="508" width="240" height="18" rx="9" fill="#148f77"/>
  <text x="725" y="520" text-anchor="middle" fill="#d1f2eb" font-size="9">SEI-CMM → SQA Activities → QA Org Structure</text>
  <rect x="605" y="530" width="240" height="18" rx="6" fill="#148f77" opacity="0.6"/>
  <text x="725" y="543" text-anchor="middle" fill="#d1f2eb" font-size="8">Testing Strategies, SQA Plan</text>
