  <text x="450" y="110" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">UNIT 1 — Introduction to SPM (Foundation)</text>

  <!-- Sub-tags for Unit 1 -->
  <rect x="210" y="130" width="90" height="22" rx="11" fill="#34495e"/>
  <text x="255" y="145" text-anchor="middle" fill="#ddd" font-size="9">SP Attributes</text>
  <rect x="310" y="130" width="90" height="22" rx="11" fill="#34495e"/>
  <text x="355" y="145" text-anchor="middle" fill="#ddd" font-size="9">SP vs Physical</text>
  <rect x="410" y="130" width="100" height="22" rx="11" fill="#34495e"/>
  <text x="460" y="145" text-anchor="middle" fill="#ddd" font-size="9">SPM Framework</text>
