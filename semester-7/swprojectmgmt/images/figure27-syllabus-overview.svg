  <text x="160" y="258" text-anchor="middle" fill="#aed6f1" font-size="9">Strategic Assessment</text>
  <rect x="230" y="244" width="120" height="20" rx="10" fill="#1a5276"/>
  <text x="290" y="258" text-anchor="middle" fill="#aed6f1" font-size="9">Technical Assessment</text>
