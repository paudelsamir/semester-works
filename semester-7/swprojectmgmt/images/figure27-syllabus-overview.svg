  <text x="725" y="274" text-anchor="middle" fill="#fdebd0" font-size="9">Analysis</text>
  <rect x="765" y="260" width="80" height="20" rx="10" fill="#ca6f1e"/>
  <text x="805" y="274" text-anchor="middle" fill="#fdebd0" font-size="9">Z-Value Eval</text>
  <rect x="605" y="284" width="240" height="22" rx="6" fill="#ca6f1e" opacity="0.6"/>
  <text x="725" y="299" text-anchor="middle" fill="#fdebd0" font-size="9">Risk Register → PERT-based schedule risk</text>
  <!-- Connection lines: Unit 4 to pipeline -->
