  <line x1="585" y1="270" x2="525" y2="370" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="585" y1="290" x2="525" y2="490" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="4,2"/>
