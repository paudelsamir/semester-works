  <text x="165" y="498" text-anchor="middle" fill="#fef9e7" font-size="9">Resource Requirements</text>
  <rect x="240" y="484" width="100" height="20" rx="10" fill="#d68910"/>
  <text x="290" y="498" text-anchor="middle" fill="#fef9e7" font-size="9">Smoothening</text>
  <rect x="350" y="484" width="100" height="20" rx="10" fill="#d68910"/>
