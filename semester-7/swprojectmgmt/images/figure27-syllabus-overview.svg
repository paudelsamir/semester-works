  <text x="725" y="594" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">UNIT 9 — SCM</text>
  <rect x="605" y="606" width="80" height="18" rx="9" fill="#2176ae"/>
  <text x="645" y="618" text-anchor="middle" fill="#d4e6f1" font-size="8">Baselines</text>
  <rect x="695" y="606" width="80" height="18" rx="9" fill="#2176ae"/>
  <text x="735" y="618" text-anchor="middle" fill="#d4e6f1" font-size="8">Change Control</text>
  <rect x="785" y="606" width="60" height="18" rx="9" fill="#2176ae"/>
  <text x="815" y="618" text-anchor="middle" fill="#d4e6f1" font-size="8">Audits</text>
  <!-- Connection -->
  <line x1="585" y1="610" x2="525" y2="610" stroke="#3498db" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="555" y="608" fill="#3498db" font-size="8" transform="rotate(-90,555,608)">version mgmt</text>

  <!-- Legend / Time arrow -->
