  <text x="645" y="394" text-anchor="middle" fill="#d2b4de" font-size="8">Fixed Price</text>
  <rect x="695" y="382" width="80" height="18" rx="9" fill="#6c3483"/>
  <text x="735" y="394" text-anchor="middle" fill="#d2b4de" font-size="8">Time &amp; Materials</text>
  <rect x="785" y="382" width="60" height="18" rx="9" fill="#6c3483"/>
  <text x="815" y="394" text-anchor="middle" fill="#d2b4de" font-size="8">Per-Unit</text>
