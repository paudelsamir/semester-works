  <text x="300" y="710" text-anchor="middle" fill="#555" font-size="11">Project Timeline →</text>
  <line x1="120" y1="722" x2="480" y2="722" stroke="#bdc3c7" stroke-width="2"/>
  <circle cx="120" cy="722" r="4" fill="#2980b9"/>
  <circle cx="220" cy="722" r="4" fill="#27ae60"/>
  <circle cx="320" cy="722" r="4" fill="#f39c12"/>
  <circle cx="420" cy="722" r="4" fill="#e74c3c"/>
  <text x="120" y="740" text-anchor="middle" fill="#2980b9" font-size="8">Analysis</text>
  <text x="220" y="740" text-anchor="middle" fill="#27ae60" font-size="8">Planning</text>
  <text x="320" y="740" text-anchor="middle" fill="#f39c12" font-size="8">Allocate</text>
  <text x="420" y="740" text-anchor="middle" fill="#e74c3c" font-size="8">Execute</text>

  <!-- Hours -->
  <rect x="600" y="690" width="240" height="55" rx="10" fill="#f7f9fa" stroke="#e0e4e8" stroke-width="1"/>
  <text x="720" y="710" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">Contact Hours</text>
  <text x="720" y="730" text-anchor="middle" fill="#7f8c8d" font-size="10">U1(5) + U2(8) + U3(7) + U4(4) + U5(4) + U6(4) + U7(5) + U8(5) + U9(3) = 45 Hrs</text>
