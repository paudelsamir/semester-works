<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Div</title>
    <style>
        .floating-div {
            float: right;
            border: 2px solid black;
            padding: 10px;
            width: 150px;
            text-align: left;
        }
        .floating-div ul {
            margin: 0;
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <div class="floating-div">
        <p><strong>CSIT</strong></p>
        <ol>
            <li>PMC</li>
            <li>BMC</li>
        </ol>
        <p><strong>BCA</strong></p>
        <ul>
            <li>TC</li>
            <li>PPL</li>
        </ul>
    </div>
</body>
</html>
